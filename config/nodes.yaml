# =====================================================================
# DANH SÁCH 10 NODE
# =====================================================================
# Mỗi node có:
#   id        : trùng với topic node publish (iot/nodes/<id>)
#   name      : tên gợi nhớ
#   type      : loại thiết bị / cảm biến
#   protocol  : cách node giao tiếp với gateway (mqtt/http/modbus/lora...)
#   metrics   : các trường dữ liệu mong đợi (để kiểm tra & gắn đơn vị)
#   enabled   : true/false để bật/tắt xử lý node đó
#
# Ở bản mẫu này TẤT CẢ node dùng MQTT (ESP32 publish JSON).
# Bạn có thể mở rộng adapter cho Modbus/LoRa sau này.

nodes:
  - id: "node-01"
    name: "Nhiet do - Do am phong 1"
    type: "DHT22"
    protocol: "mqtt"
    metrics:
      temperature: { unit: "C",  min: -40, max: 80 }
      humidity:    { unit: "%",  min: 0,   max: 100 }
    enabled: true

  - id: "node-02"
    name: "Nhiet do - Do am phong 2"
    type: "DHT22"
    protocol: "mqtt"
    metrics:
      temperature: { unit: "C",  min: -40, max: 80 }
      humidity:    { unit: "%",  min: 0,   max: 100 }
    enabled: true

  - id: "node-03"
    name: "Cam bien anh sang"
    type: "BH1750"
    protocol: "mqtt"
    metrics:
      lux: { unit: "lx", min: 0, max: 65535 }
    enabled: true

  - id: "node-04"
    name: "Chat luong khong khi"
    type: "MQ135"
    protocol: "mqtt"
    metrics:
      co2_ppm: { unit: "ppm", min: 0, max: 5000 }
      voc:     { unit: "ppb", min: 0, max: 60000 }
    enabled: true

  - id: "node-05"
    name: "Cam bien do am dat"
    type: "Capacitive-Soil"
    protocol: "mqtt"
    metrics:
      soil_moisture: { unit: "%", min: 0, max: 100 }
    enabled: true

  - id: "node-06"
    name: "Cong tac cua / chuyen dong"
    type: "PIR+Reed"
    protocol: "mqtt"
    metrics:
      motion: { unit: "bool", min: 0, max: 1 }
      door:   { unit: "bool", min: 0, max: 1 }
    enabled: true

  - id: "node-07"
    name: "Dien nang tieu thu"
    type: "PZEM-004T"
    protocol: "mqtt"
    metrics:
      voltage: { unit: "V",   min: 0,  max: 300 }
      current: { unit: "A",   min: 0,  max: 100 }
      power:   { unit: "W",   min: 0,  max: 23000 }
      energy:  { unit: "kWh", min: 0,  max: 999999 }
    enabled: true

  - id: "node-08"
    name: "Muc nuoc / bon chua"
    type: "Ultrasonic-JSN"
    protocol: "mqtt"
    metrics:
      level_cm: { unit: "cm", min: 0, max: 400 }
    enabled: true

  - id: "node-09"
    name: "Nhiet do cong nghiep"
    type: "DS18B20"
    protocol: "mqtt"
    metrics:
      temperature: { unit: "C", min: -55, max: 125 }
    enabled: true

  - id: "node-10"
    name: "Ap suat khi"
    type: "BMP280"
    protocol: "mqtt"
    metrics:
      pressure:    { unit: "hPa", min: 300, max: 1100 }
      temperature: { unit: "C",   min: -40, max: 85 }
    enabled: true
